backend:
  name: github
  repo: L1N3JUM0/hbi-site
  branch: main
  # Service d'authentification GitHub (Cloudflare Worker, dépôt
  # sveltia-cms-auth). Déployé manuellement en CLI (pas depuis ce dépôt) :
  # voir le Worker "sveltia-cms-auth" sur le compte Cloudflare du club.
  base_url: https://sveltia-cms-auth.hbi-hand84.workers.dev

# Publication directe (pas de workflow éditorial) : les deux seules
# personnes ayant accès au CMS sont administratrices et à l'aise
# techniquement, l'étape de relecture n'apportait rien ici. Si l'accès est
# un jour élargi à des bénévoles non techniques, réactiver la relecture
# avant publication en ajoutant la ligne :
#   publish_mode: editorial_workflow

site_url: https://l1n3jum0.github.io/hbi-site
show_preview_links: false

# Dossier où sont stockées les images uploadées (celui déjà utilisé par le
# site). Sert de médiathèque globale, partagée par toutes les collections
# ci-dessous : une image uploadée une fois depuis n'importe quel champ photo
# est ensuite proposée dans le sélecteur de n'importe quel autre champ photo.
media_folder: "src/assets"
public_folder: "/src/assets"

# Optimisation automatique des images à l'envoi (dans le navigateur, avant
# écriture dans le dépôt) : les bénévoles n'ont rien à préparer eux-mêmes
# (compression, redimensionnement...) avant d'envoyer une affiche Canva ou
# une photo de téléphone. Voir GUIDE-EDITION.md.
media_libraries:
  all:
    # 2048px de large/haut couvre largement le plus grand affichage réel du
    # site (la photo de couverture d'un article, demandée en 1200px à
    # Astro) tout en gardant de la marge pour les écrans à haute densité de
    # pixels (Retina/2x). Ne fait que réduire les images plus grandes que
    # ça -- une image déjà plus petite n'est jamais agrandie.
    transformations:
      raster_image:
        format: webp
        width: 2048
        height: 2048
      svg:
        optimize: true
    # Vérifiée APRÈS optimisation (donc sur le fichier déjà compressé) :
    # une limite haute ici est un simple garde-fou contre un fichier
    # anormal, pas un budget serré -- une photo optimisée dépasse rarement
    # quelques centaines de Ko.
    max_file_size: 5000000
    slugify_filename: true

collections:
  - name: "leClub"
    label: "Page « Le club »"
    description: "Le contenu de la page /le-club : histoire, parrain, infos pratiques. Page unique : pas de création ni de suppression possible ici."
    files:
      - name: "page"
        label: "Contenu de la page « Le club »"
        file: "src/content/le-club/page.md"
        fields:
          - label: "Histoire (avant la citation)"
            name: "histoireIntro"
            widget: "text"
            hint: "Le texte affiché avant la citation mise en avant. Laissez une ligne vide entre deux paragraphes."

          - label: "Citation mise en avant"
            name: "devise"
            widget: "string"
            hint: "Affichée automatiquement entre guillemets. N'ajoutez pas les guillemets vous-même."

          - label: "Histoire (après la citation)"
            name: "histoireConclusion"
            widget: "text"
            hint: "Le texte affiché après la citation. Laissez une ligne vide entre deux paragraphes."

          - label: "Nom du parrain"
            name: "parrainNom"
            widget: "string"

          - label: "Photo du parrain"
            name: "parrainPhoto"
            widget: "image"
            hint: "Glissez-déposez une image, ou choisissez-en une déjà présente dans la médiathèque."
            choose_url: false

          - label: "Description de la photo du parrain"
            name: "parrainPhotoAlt"
            widget: "string"
            hint: "Décrit la photo pour les personnes malvoyantes qui utilisent un lecteur d'écran."

          - label: "Présentation du parrain"
            name: "parrainTexte"
            widget: "text"
            hint: "Laissez une ligne vide entre deux paragraphes."

          - label: "Nom du lieu d'entraînement"
            name: "lieuNom"
            widget: "string"

          - label: "Adresse du lieu d'entraînement"
            name: "lieuAdresse"
            widget: "string"

          - label: "Téléphone"
            name: "telephone"
            widget: "string"

          - label: "E-mail"
            name: "email"
            widget: "string"

          - label: "Lien Instagram"
            name: "instagramUrl"
            widget: "string"

          - label: "Lien Facebook"
            name: "facebookUrl"
            widget: "string"

  - name: "histoireClub"
    label: "Moments marquants & figures du club"
    label_singular: "Moment ou figure"
    description: "L'histoire du club racontée par étapes, affichée sur /le-club sous la section parrain : un tournoi mémorable, une personne qui a compté, une saison marquante... Vide au départ, à compléter au fil du temps."
    folder: "src/content/histoire-club"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "titre"
    summary: "{{periode}} — {{titre}}"
    fields:
      - label: "Titre"
        name: "titre"
        widget: "string"
        hint: "Exemple : « La montée en Nationale 3 », ou le nom d'une personne."

      - label: "Période"
        name: "periode"
        widget: "string"
        hint: "Une date, une saison ou une période, au choix. Exemple : 1977, Saison 2010-2011, Années 1990."

      - label: "Texte"
        name: "texte"
        widget: "text"
        hint: "Quelques phrases racontant ce moment ou cette personne."

      - label: "Photo (optionnelle)"
        name: "photo"
        widget: "image"
        required: false
        hint: "Portrait, carrée ou paysage : la photo s'affichera entière, sans recadrage. Glissez-déposez une image, ou choisissez-en une déjà présente dans la médiathèque."
        choose_url: false

      - label: "Description de la photo"
        name: "photoAlt"
        widget: "string"
        required: false
        hint: "Décrit la photo pour les personnes malvoyantes qui utilisent un lecteur d'écran (uniquement si une photo est ajoutée)."

      - label: "Ordre d'affichage"
        name: "ordre"
        widget: "number"
        value_type: "int"
        hint: "Détermine l'ordre d'apparition (1 = en premier), par exemple du plus ancien au plus récent."

  - name: "photosAccueil"
    label: "Photos de la page d'accueil"
    label_singular: "Photo"
    description: "Les photos qui défilent dans le bandeau « La vie du club, en images » sur la page d'accueil."
    folder: "src/content/photos-accueil"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    summary: "{{alt}}"
    fields:
      - label: "Photo"
        name: "image"
        widget: "image"
        hint: "Glissez-déposez une image, ou choisissez-en une déjà présente dans la médiathèque."
        choose_url: false

      - label: "Description de la photo"
        name: "alt"
        widget: "string"
        hint: "Décrivez brièvement ce que montre la photo (utile pour les personnes malvoyantes qui utilisent un lecteur d'écran). Exemple : « Match des seniors féminines au COSEC Émile Avy »."

      - label: "Ordre d'affichage"
        name: "ordre"
        widget: "number"
        value_type: "int"
        hint: "Détermine l'ordre de passage dans le carrousel (1 = en premier). Deux photos ne devraient pas avoir le même numéro."

  - name: "equipes"
    label: "Équipes"
    label_singular: "Équipe"
    description: "Les informations et photos de chaque équipe/créneau du club. La liste des équipes est fixée pour la saison : on ne peut qu'en modifier le contenu, pas en ajouter ou en supprimer ici."
    folder: "src/content/equipes"
    create: false
    delete: false
    extension: "md"
    format: "frontmatter"
    identifier_field: "nom"
    summary: "{{nom}}"
    fields:
      - label: "Nom de l'équipe"
        name: "nom"
        widget: "string"

      - label: "Catégorie"
        name: "type"
        widget: "select"
        hint: "À ne changer que si la nature réelle du créneau évolue : cela déplace l'équipe d'une section à l'autre du site."
        options:
          - { label: "Équipe de compétition", value: "competition" }
          - { label: "Créneau découverte (ouvert à tous, sans compétition)", value: "decouverte" }
          - { label: "Créneau inclusion (handball adapté)", value: "inclusion" }
          - { label: "Créneau transversal (plusieurs catégories)", value: "transversal" }

      - label: "Identifiant technique"
        name: "slug"
        widget: "hidden"

      - label: "Ordre d'affichage"
        name: "ordre"
        widget: "hidden"

      - label: "Jours et horaires d'entraînement"
        name: "horaires"
        widget: "string"
        hint: "Exemple : Mercredi et vendredi 20h30-22h30"

      - label: "Encadrant(s)"
        name: "encadrants"
        widget: "string"

      - label: "Tarif de la licence"
        name: "tarif"
        widget: "string"
        hint: "Exemple : 220 €"

      - label: "Description courte"
        name: "description"
        widget: "text"
        hint: "1 à 2 phrases. Affichée sur la page d'accueil et sur la page Équipes."

      - label: "Photo de l'équipe"
        name: "photoProfil"
        widget: "image"
        hint: "C'est LA photo affichée sur la page d'accueil et en haut de la fiche équipe sur /equipes. Glissez-déposez une image, ou choisissez-en une déjà présente dans la médiathèque."
        choose_url: false

      - label: "Galerie de photos"
        name: "galerie"
        widget: "list"
        hint: "Toutes les photos qui défilent dans le carrousel de la page Équipes. Vous pouvez reprendre la photo ci-dessus et/ou en ajouter d'autres."
        field:
          label: "Photo"
          name: "image"
          widget: "image"
          choose_url: false

  - name: "articles"
    label: "Vie du club"
    label_singular: "Article"
    description: "Les actualités du club (tournois, moments conviviaux...) affichées sur la page /vie-du-club."
    folder: "src/content/articles"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "titre"
    summary: "{{titre}}"
    fields:
      - label: "Titre de l'article"
        name: "titre"
        widget: "string"

      - label: "Date de publication"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        hint: "Détermine l'ordre d'affichage des articles (le plus récent en premier)."

      - label: "Photo de couverture"
        name: "couverture"
        widget: "image"
        hint: "Affichée en haut de l'article et sur la liste des articles. Glissez-déposez une image, ou choisissez-en une déjà présente dans la médiathèque."
        choose_url: false

      - label: "Extrait (résumé court)"
        name: "extrait"
        widget: "text"
        hint: "1 à 2 phrases, affichées dans la liste des articles sur /vie-du-club."

      - label: "Identifiant technique de l'adresse (URL)"
        name: "slug"
        widget: "string"
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Uniquement des lettres minuscules, chiffres et tirets, sans espace ni accent (exemple : tournoi-de-noel)."]
        hint: "Détermine l'adresse de la page de l'article (ex. 'tournoi-de-noel' donnera /vie-du-club/tournoi-de-noel). Choisissez-le à la création et ne le modifiez plus ensuite : le changer casserait le lien si l'article a déjà été partagé."

      - label: "Contenu de l'article"
        name: "body"
        widget: "markdown"
        hint: "Le texte de l'article. Vous pouvez aussi insérer des photos directement dans le texte avec le bouton image de la barre d'outils."

  - name: "partenaires"
    label: "Partenaires"
    label_singular: "Partenaire"
    description: "Les partenaires/sponsors affichés sur la page d'accueil."
    folder: "src/content/partenaires"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "nom"
    summary: "{{nom}}"
    fields:
      - label: "Nom du partenaire"
        name: "nom"
        widget: "string"

      - label: "Logo"
        name: "logo"
        widget: "image"
        hint: "Idéalement un fond transparent (PNG) ou blanc. Glissez-déposez une image, ou choisissez-en une déjà présente dans la médiathèque."
        choose_url: false

      - label: "Site web du partenaire"
        name: "url"
        widget: "string"
        pattern: ["^https?://.+", "L'adresse doit commencer par http:// ou https://"]
        hint: "Le logo renverra vers cette adresse. Exemple : https://exemple.com"

      - label: "Description courte"
        name: "description"
        widget: "text"
        required: false
        hint: "Optionnelle : pas affichée sur le site pour l'instant, mais disponible pour plus tard."

  - name: "feuillesMatch"
    label: "Feuilles de match"
    label_singular: "Feuille de match"
    description: "Déposez ici le PDF de la feuille de match téléchargé sur le site de la FFHandball : le résultat, la chronologie et les statistiques sont ajoutés automatiquement au site lors de la prochaine reconstruction (quelques minutes, pas d'autre action nécessaire). Voir GUIDE-EDITION.md pour la marche à suivre complète."
    folder: "src/content/feuilles-match"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    fields:
      - label: "Feuille de match (PDF)"
        name: "pdf"
        widget: "file"
        media_folder: "src/content/feuilles-match/files"
        public_folder: "/src/content/feuilles-match/files"
        hint: "Le PDF téléchargé depuis le site de la FFHandball (voir GUIDE-EDITION.md pour savoir où le trouver)."

  - name: "resultats"
    label: "Résultats"
    label_singular: "Résultat"
    description: "Un résultat par match. Rempli automatiquement dès qu'une feuille de match est déposée dans « Feuilles de match » : n'utilisez « Nouveau résultat » qu'en secours, pour un match dont vous n'avez pas pu récupérer la feuille (score et infos de base uniquement dans ce cas)."
    folder: "src/content/resultats"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    summary: "{{adversaire}} — {{date}}"
    fields:
      - label: "Équipe"
        name: "equipeSlug"
        widget: "relation"
        collection: "equipes"
        search_fields: ["nom"]
        value_field: "slug"
        display_fields: ["nom"]
        hint: "Détectée automatiquement pour un résultat importé depuis une feuille de match ; à corriger ici seulement si la détection s'est trompée (compétition non reconnue)."

      - label: "Date et heure du match"
        name: "date"
        widget: "datetime"

      - label: "Journée"
        name: "journee"
        widget: "string"
        required: false
        hint: "Exemple : J1. Laissez vide pour un match de coupe ou amical."

      - label: "Compétition"
        name: "competition"
        widget: "string"
        required: false

      - label: "Type de match"
        name: "typeMatch"
        widget: "select"
        default: "championnat"
        options:
          - { label: "Championnat", value: "championnat" }
          - { label: "Coupe", value: "coupe" }
          - { label: "Autre", value: "autre" }

      - label: "Le HBI recevait"
        name: "domicile"
        widget: "boolean"
        default: true

      - label: "Adversaire"
        name: "adversaire"
        widget: "string"

      - label: "Salle"
        name: "salle"
        widget: "string"
        required: false

      - label: "Score du HBI"
        name: "scoreDomicile"
        widget: "number"
        value_type: "int"
        hint: "Le score du HBI si « Le HBI recevait » est coché, sinon le score de l'adversaire."

      - label: "Score de l'adversaire"
        name: "scoreExterieur"
        widget: "number"
        value_type: "int"

      - label: "Score du HBI à la mi-temps"
        name: "scoreMiTempsDomicile"
        widget: "number"
        value_type: "int"
        required: false

      - label: "Score de l'adversaire à la mi-temps"
        name: "scoreMiTempsExterieur"
        widget: "number"
        value_type: "int"
        required: false

      # Champs techniques : remplis automatiquement par l'import d'une
      # feuille de match, jamais à saisir à la main -- masqués du
      # formulaire (widget "hidden") pour ne pas être modifiés ou effacés
      # par erreur en éditant les champs ci-dessus.
      - label: "Origine (technique)"
        name: "source"
        widget: "hidden"
        default: "manuel"

      - label: "Code rencontre (technique)"
        name: "codeRencontre"
        widget: "hidden"
        required: false

      - label: "Chronologie (technique)"
        name: "chronologie"
        widget: "hidden"
        required: false

      - label: "Stats équipe domicile (technique)"
        name: "statsEquipeDomicile"
        widget: "hidden"
        required: false

      - label: "Stats équipe extérieur (technique)"
        name: "statsEquipeExterieur"
        widget: "hidden"
        required: false

      - label: "Stats joueur·se·s (technique)"
        name: "statsJoueurs"
        widget: "hidden"
        required: false
