backend:
  name: github
  repo: L1N3JUM0/hbi-site
  branch: main
  # Service d'authentification GitHub (Cloudflare Worker, dépôt
  # sveltia-cms-auth). Déployé manuellement en CLI (pas depuis ce dépôt) :
  # voir le Worker "sveltia-cms-auth" sur le compte Cloudflare du club.
  base_url: https://sveltia-cms-auth.hbi-hand84.workers.dev

# Publication directe (pas de workflow éditorial) : les deux seules
# personnes ayant accès au CMS sont administratrices et à l'aise
# techniquement, l'étape de relecture n'apportait rien ici. Si l'accès est
# un jour élargi à des bénévoles non techniques, réactiver la relecture
# avant publication en ajoutant la ligne :
#   publish_mode: editorial_workflow

site_url: https://l1n3jum0.github.io/hbi-site
show_preview_links: false

# Dossier où sont stockées les images uploadées (celui déjà utilisé par le
# site). Sert de médiathèque globale, partagée par toutes les collections
# ci-dessous : une image uploadée une fois depuis n'importe quel champ photo
# est ensuite proposée dans le sélecteur de n'importe quel autre champ photo.
media_folder: "src/assets"
public_folder: "/src/assets"

# Optimisation automatique des images à l'envoi (dans le navigateur, avant
# écriture dans le dépôt) : les bénévoles n'ont rien à préparer eux-mêmes
# (compression, redimensionnement...) avant d'envoyer une affiche Canva ou
# une photo de téléphone. Voir GUIDE-EDITION.md.
media_libraries:
  all:
    # 2048px de large/haut couvre largement le plus grand affichage réel du
    # site (la photo de couverture d'un article, demandée en 1200px à
    # Astro) tout en gardant de la marge pour les écrans à haute densité de
    # pixels (Retina/2x). Ne fait que réduire les images plus grandes que
    # ça -- une image déjà plus petite n'est jamais agrandie.
    transformations:
      raster_image:
        format: webp
        width: 2048
        height: 2048
      svg:
        optimize: true
    # Vérifiée APRÈS optimisation (donc sur le fichier déjà compressé) :
    # une limite haute ici est un simple garde-fou contre un fichier
    # anormal, pas un budget serré -- une photo optimisée dépasse rarement
    # quelques centaines de Ko.
    max_file_size: 5000000
    slugify_filename: true

collections:
  - name: "leClub"
    label: "Page « Le club »"
    description: "Le contenu de la page /le-club : histoire, parrain, infos pratiques. Page unique : pas de création ni de suppression possible ici."
    files:
      - name: "page"
        label: "Contenu de la page « Le club »"
        file: "src/content/le-club/page.md"
        fields:
          - label: "Histoire (avant la citation)"
            name: "histoireIntro"
            widget: "text"
            hint: "Le texte affiché avant la citation mise en avant. Laissez une ligne vide entre deux paragraphes."

          - label: "Citation mise en avant"
            name: "devise"
            widget: "string"
            hint: "Affichée automatiquement entre guillemets. N'ajoutez pas les guillemets vous-même."

          - label: "Histoire (après la citation)"
            name: "histoireConclusion"
            widget: "text"
            hint: "Le texte affiché après la citation. Laissez une ligne vide entre deux paragraphes."

          - label: "Nom du parrain"
            name: "parrainNom"
            widget: "string"

          - label: "Photo du parrain"
            name: "parrainPhoto"
            widget: "image"
            hint: "Glissez-déposez une image, ou choisissez-en une déjà présente dans la médiathèque."
            choose_url: false

          - label: "Description de la photo du parrain"
            name: "parrainPhotoAlt"
            widget: "string"
            hint: "Décrit la photo pour les personnes malvoyantes qui utilisent un lecteur d'écran."

          - label: "Présentation du parrain"
            name: "parrainTexte"
            widget: "text"
            hint: "Laissez une ligne vide entre deux paragraphes."

          - label: "Nom du lieu d'entraînement"
            name: "lieuNom"
            widget: "string"

          - label: "Adresse du lieu d'entraînement"
            name: "lieuAdresse"
            widget: "string"

          - label: "Téléphone"
            name: "telephone"
            widget: "string"

          - label: "E-mail"
            name: "email"
            widget: "string"

          - label: "Lien Instagram"
            name: "instagramUrl"
            widget: "string"

          - label: "Lien Facebook"
            name: "facebookUrl"
            widget: "string"

  - name: "histoireClub"
    label: "Moments marquants & figures du club"
    label_singular: "Moment ou figure"
    description: "L'histoire du club racontée par étapes, affichée sur /le-club sous la section parrain : un tournoi mémorable, une personne qui a compté, une saison marquante... Vide au départ, à compléter au fil du temps."
    folder: "src/content/histoire-club"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "titre"
    summary: "{{periode}} — {{titre}}"
    fields:
      - label: "Titre"
        name: "titre"
        widget: "string"
        hint: "Exemple : « La montée en Nationale 3 », ou le nom d'une personne."

      - label: "Période"
        name: "periode"
        widget: "string"
        hint: "Une date, une saison ou une période, au choix. Exemple : 1977, Saison 2010-2011, Années 1990."

      - label: "Texte"
        name: "texte"
        widget: "text"
        hint: "Quelques phrases racontant ce moment ou cette personne."

      - label: "Photo (optionnelle)"
        name: "photo"
        widget: "image"
        required: false
        hint: "Portrait, carrée ou paysage : la photo s'affichera entière, sans recadrage. Glissez-déposez une image, ou choisissez-en une déjà présente dans la médiathèque."
        choose_url: false

      - label: "Description de la photo"
        name: "photoAlt"
        widget: "string"
        required: false
        hint: "Décrit la photo pour les personnes malvoyantes qui utilisent un lecteur d'écran (uniquement si une photo est ajoutée)."

      - label: "Ordre d'affichage"
        name: "ordre"
        widget: "number"
        value_type: "int"
        hint: "Détermine l'ordre d'apparition (1 = en premier), par exemple du plus ancien au plus récent."

  - name: "photosAccueil"
    label: "Photos de la page d'accueil"
    description: "Les photos qui défilent dans le bandeau « La vie du club, en images » sur la page d'accueil."
    files:
      - name: "page"
        label: "Photos du bandeau"
        file: "src/content/photos-accueil/page.md"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{fields.alt}}"
            hint: "Utilisez la poignée à gauche de chaque photo pour la faire glisser et changer son ordre de passage dans le carrousel -- plus besoin de numéro. Le bouton en bas ajoute une nouvelle photo, la poubelle en retire une."
            fields:
              - label: "Photo"
                name: "image"
                widget: "image"
                hint: "Glissez-déposez une image, ou choisissez-en une déjà présente dans la médiathèque."
                choose_url: false

              - label: "Description de la photo"
                name: "alt"
                widget: "string"
                hint: "Décrivez brièvement ce que montre la photo (utile pour les personnes malvoyantes qui utilisent un lecteur d'écran). Exemple : « Match des seniors féminines au COSEC Émile Avy »."

  - name: "photosHero"
    label: "Photos du bandeau d'accueil (diaporama)"
    description: "Les photos d'ACTION (jeu, compétition) qui défilent en grand en haut de la page d'accueil. Choisissez des photos de match ou d'entraînement montrant de l'intensité sportive -- pas de photos posées ni de groupe, qui ont leur place dans « Photos de la page d'accueil » ci-dessus. 4 à 5 photos donnent le meilleur rythme."
    files:
      - name: "page"
        label: "Photos du diaporama"
        file: "src/content/photos-hero/page.md"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{fields.alt}}"
            hint: "Utilisez la poignée à gauche de chaque photo pour la faire glisser et changer son ordre de passage -- plus besoin de numéro. Le bouton en bas ajoute une nouvelle photo, la poubelle en retire une."
            fields:
              - label: "Photo"
                name: "image"
                widget: "image"
                hint: "Glissez-déposez une image, ou choisissez-en une déjà présente dans la médiathèque. Préférez une photo nette, prise pendant le jeu (pas posée)."
                choose_url: false

              - label: "Description de la photo"
                name: "alt"
                widget: "string"
                hint: "Décrivez brièvement l'action montrée (utile pour les personnes malvoyantes qui utilisent un lecteur d'écran). Exemple : « Tir en suspension lors d'un match du Handball Islois »."

  - name: "equipes"
    label: "Équipes"
    label_singular: "Équipe"
    description: "Les informations et photos de chaque équipe/créneau du club. Vous pouvez créer une nouvelle équipe (ex. une nouvelle catégorie d'âge) directement ici. Une équipe qui s'arrête ne se supprime jamais : passez son Statut à « Archivée » pour garder ses résultats consultables (voir GUIDE-EDITION.md, section « Changement de saison »)."
    folder: "src/content/equipes"
    create: true
    delete: false
    extension: "md"
    format: "frontmatter"
    identifier_field: "nom"
    summary: "{{nom}}"
    fields:
      - label: "Nom de l'équipe"
        name: "nom"
        widget: "string"

      - label: "Catégorie"
        name: "type"
        widget: "select"
        hint: "À ne changer que si la nature réelle du créneau évolue : cela déplace l'équipe d'une section à l'autre du site."
        options:
          - { label: "Équipe de compétition", value: "competition" }
          - { label: "Créneau découverte (ouvert à tous, sans compétition)", value: "decouverte" }
          - { label: "Créneau inclusion (handball adapté)", value: "inclusion" }
          - { label: "Créneau transversal (plusieurs catégories)", value: "transversal" }

      - label: "Statut"
        name: "statut"
        widget: "select"
        default: "active"
        hint: "Une équipe qui s'arrête (dissoute, catégorie non reconduite la saison suivante...) passe en « Archivée » plutôt que d'être supprimée. Elle disparaît alors de la liste principale de /equipes (plus d'horaires ni de tarif, qui n'ont plus de sens) mais reste visible dans une section « Équipes des saisons passées » en bas de page, avec ses résultats toujours consultables."
        options:
          - { label: "Active", value: "active" }
          - { label: "Archivée (ne joue plus, résultats conservés)", value: "archivee" }

      - label: "Identifiant technique"
        name: "slug"
        widget: "string"
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Uniquement des lettres minuscules, chiffres et tirets, sans espace ni accent (exemple : u16-masculins)."]
        hint: "À choisir à la création d'une nouvelle équipe, en cohérence avec son nom (ex. « U16 masculins » → « u16-masculins »). Ne le modifiez plus une fois l'équipe créée : il sert d'ancre sur /equipes et relie les résultats de match à cette équipe -- le changer casserait ce lien pour les résultats déjà enregistrés."

      - label: "Catégorie d'âge (pour le rattachement automatique des feuilles de match)"
        name: "categorieAge"
        widget: "string"
        required: false
        pattern: ["^(U\\d{1,2}|senior)$", "Exactement « U » suivi de l'âge (exemple : U13, U17), ou « senior »."]
        hint: "Exactement comme dans le nom de la compétition sur les feuilles de match FFHandball (ex. U13, U17), ou « senior » pour les seniors. Permet au site de reconnaître automatiquement à quelle équipe rattacher une feuille de match déposée, ET de la placer au bon endroit dans la liste des équipes (voir « Ordre d'affichage » plus bas). Laissez vide pour un créneau qui ne joue pas de championnat classé par âge (Loisirs, Découverte, Handensemble, créneau transversal)."

      - label: "Genre (pour le rattachement automatique des feuilles de match)"
        name: "genre"
        widget: "select"
        required: false
        hint: "Avec « Catégorie d'âge » ci-dessus, permet de distinguer automatiquement deux équipes du même âge (ex. U13 féminines et U13 masculins). Laissez vide si « Catégorie d'âge » est vide."
        options:
          - { label: "Mixte", value: "mixte" }
          - { label: "Féminin", value: "feminin" }
          - { label: "Masculin", value: "masculin" }

      - label: "Ordre d'affichage (uniquement si pas de catégorie d'âge)"
        name: "ordre"
        widget: "number"
        value_type: "int"
        required: false
        hint: "Si « Catégorie d'âge » est renseigné ci-dessus, ce champ est inutile et ignoré : l'équipe se place automatiquement du plus jeune au plus âgé. Il ne sert que pour un créneau SANS catégorie d'âge (Loisirs, Découverte, Handensemble, créneau transversal), pour choisir sa position à la main. Laissé vide, un tel créneau s'affiche en dernier."

      - label: "Calendriers de compétition (flux FFHandball)"
        name: "calendriers"
        widget: "list"
        required: false
        summary: "{{fields.repere}}"
        hint: "Un calendrier par équipe engagée en championnat dans cette catégorie. Sur la page de la compétition sur ffhandball.fr, cliquez sur « Ajouter les matchs à votre calendrier » et copiez le lien .ics proposé. Laissez cette liste vide tant que le calendrier de la saison n'est pas encore publié par la fédération, ou pour un créneau qui ne joue pas de championnat : l'équipe n'apparaît simplement pas dans l'agenda, sans erreur."
        fields:
          - label: "Lien du calendrier (.ics)"
            name: "url"
            widget: "string"
            pattern: ["^https?://.+\\.ics$", "L'adresse doit commencer par http:// ou https:// et se terminer par .ics"]
            hint: "Le lien copié depuis le bouton « Ajouter les matchs à votre calendrier » de ffhandball.fr."

          - label: "Repère de cette équipe dans le flux"
            name: "repere"
            widget: "string"
            default: "Handball Islois"
            hint: "Ne changez cette valeur que si PLUSIEURS équipes du club jouent dans la même poule (ex. Seniors masculins 1 et 2) : indiquez alors le texte exact qui les distingue sur ffhandball.fr (ex. « Handball Islois 1 »). Dans tous les autres cas, laissez la valeur par défaut."

          - label: "Libellé (si plusieurs équipes du club dans cette catégorie)"
            name: "libelle"
            widget: "string"
            required: false
            hint: "Affiché après le nom de l'équipe sur l'agenda et les résultats pour les distinguer. Laissez vide s'il n'y a qu'une seule équipe du club dans cette catégorie. Deux cas : (1) même poule (ex. Seniors masculins 1 et 2) -> mettez simplement « 1 »/« 2 ». (2) compétitions différentes (ex. U15 masculins Excellence et Départementale) -> mettez un mot qui sert AUSSI à reconnaître automatiquement les feuilles de match de cette équipe (ex. « Excellence », « Départementale ») : choisissez un mot qui apparaît tel quel (accents et majuscules ignorés) dans le nom de la compétition sur les feuilles de match, en évitant les terminaisons qui peuvent varier (préférez « Départemental » à « Départementale »)."

          - label: "Lien du classement (en secours)"
            name: "classementUrl"
            widget: "string"
            required: false
            hint: "Laissez vide : il est déduit automatiquement des matchs du calendrier dans la grande majorité des cas. Ne renseignez ce champ que si le lien « Voir le classement » sur /agenda ne fonctionne pas pour cette équipe."

      - label: "Jours et horaires d'entraînement"
        name: "horaires"
        widget: "string"
        hint: "Exemple : Mercredi et vendredi 20h30-22h30"

      - label: "Encadrant(s)"
        name: "encadrants"
        widget: "string"

      - label: "Tarif de la licence"
        name: "tarif"
        widget: "string"
        hint: "Exemple : 220 €"

      - label: "Description courte"
        name: "description"
        widget: "text"
        hint: "1 à 2 phrases. Affichée sur la page d'accueil et sur la page Équipes."

      - label: "Photo de l'équipe"
        name: "photoProfil"
        widget: "image"
        hint: "C'est LA photo affichée sur la page d'accueil et en haut de la fiche équipe sur /equipes. Glissez-déposez une image, ou choisissez-en une déjà présente dans la médiathèque."
        choose_url: false

      - label: "Galerie de photos"
        name: "galerie"
        widget: "list"
        hint: "Toutes les photos qui défilent dans le carrousel de la page Équipes. Vous pouvez reprendre la photo ci-dessus et/ou en ajouter d'autres."
        field:
          label: "Photo"
          name: "image"
          widget: "image"
          choose_url: false

  - name: "articles"
    label: "Vie du club"
    label_singular: "Article"
    description: "Les actualités du club (tournois, moments conviviaux...) affichées sur la page /vie-du-club."
    folder: "src/content/articles"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "titre"
    summary: "{{titre}}"
    fields:
      - label: "Titre de l'article"
        name: "titre"
        widget: "string"

      - label: "Date de publication"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        hint: "Détermine l'ordre d'affichage des articles (le plus récent en premier)."

      - label: "Photo de couverture"
        name: "couverture"
        widget: "image"
        hint: "Affichée en haut de l'article et sur la liste des articles. Glissez-déposez une image, ou choisissez-en une déjà présente dans la médiathèque."
        choose_url: false

      - label: "Extrait (résumé court)"
        name: "extrait"
        widget: "text"
        hint: "1 à 2 phrases, affichées dans la liste des articles sur /vie-du-club."

      - label: "Identifiant technique de l'adresse (URL)"
        name: "slug"
        widget: "string"
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Uniquement des lettres minuscules, chiffres et tirets, sans espace ni accent (exemple : tournoi-de-noel)."]
        hint: "Détermine l'adresse de la page de l'article (ex. 'tournoi-de-noel' donnera /vie-du-club/tournoi-de-noel). Choisissez-le à la création et ne le modifiez plus ensuite : le changer casserait le lien si l'article a déjà été partagé."

      - label: "Contenu de l'article"
        name: "body"
        widget: "markdown"
        hint: "Le texte de l'article. Vous pouvez aussi insérer des photos directement dans le texte avec le bouton image de la barre d'outils."

  - name: "partenaires"
    label: "Partenaires"
    label_singular: "Partenaire"
    description: "Les partenaires/sponsors affichés sur la page d'accueil."
    folder: "src/content/partenaires"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "nom"
    summary: "{{nom}}"
    fields:
      - label: "Nom du partenaire"
        name: "nom"
        widget: "string"

      - label: "Logo"
        name: "logo"
        widget: "image"
        hint: "Idéalement un fond transparent (PNG) ou blanc. Glissez-déposez une image, ou choisissez-en une déjà présente dans la médiathèque."
        choose_url: false

      - label: "Site web du partenaire"
        name: "url"
        widget: "string"
        pattern: ["^https?://.+", "L'adresse doit commencer par http:// ou https://"]
        hint: "Le logo renverra vers cette adresse. Exemple : https://exemple.com"

      - label: "Description courte"
        name: "description"
        widget: "text"
        required: false
        hint: "Optionnelle : pas affichée sur le site pour l'instant, mais disponible pour plus tard."

  - name: "feuillesMatch"
    label: "Feuilles de match"
    label_singular: "Feuille de match"
    description: "Déposez ici le PDF de la feuille de match téléchargé sur le site de la FFHandball : le résultat, la chronologie et les statistiques sont ajoutés automatiquement au site lors de la prochaine reconstruction (quelques minutes, pas d'autre action nécessaire). Voir GUIDE-EDITION.md pour la marche à suivre complète."
    folder: "src/content/feuilles-match"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    # Sans ceci, Sveltia identifie chaque entrée par un identifiant
    # technique illisible ("8b955a6d59ac") : le seul champ de la collection
    # est un fichier, pas un texte, donc pas de nom lisible à en tirer tout
    # seul. Le nom du PDF déposé (généralement le code de la rencontre côté
    # FFHandball, ex. "wagtilr.pdf") reste le seul repère disponible tant
    # que le PDF n'a pas été analysé -- un libellé du type "équipe vs
    # adversaire, date" demanderait que le résultat de l'analyse (faite
    # côté build, pas dans le CMS) soit réécrit ici, hors de portée d'une
    # simple configuration.
    summary: "{{pdf}}"
    fields:
      - label: "Feuille de match (PDF)"
        name: "pdf"
        widget: "file"
        # Chemins relatifs au dossier de la collection ("folder:" ci-dessus)
        # -- écrire ici le chemin absolu "src/content/feuilles-match/files"
        # produit un dossier DOUBLÉ sur le disque
        # ("feuilles-match/src/content/feuilles-match/files/...") : Sveltia
        # résout un media_folder/public_folder relatif par rapport au
        # dossier de la collection, pas par rapport à la racine du dépôt.
        # Vu en production le 2026-09 -- voir scripts/import-fdme.mjs qui,
        # par précaution, essaie aussi l'ancienne forme absolue au cas où.
        media_folder: "files"
        public_folder: "files"
        hint: "Le PDF téléchargé depuis le site de la FFHandball (voir GUIDE-EDITION.md pour savoir où le trouver)."

  - name: "resultats"
    label: "Résultats"
    label_singular: "Résultat"
    description: "Un résultat par match. Rempli automatiquement dès qu'une feuille de match est déposée dans « Feuilles de match » : n'utilisez « Nouveau résultat » qu'en secours, pour un match dont vous n'avez pas pu récupérer la feuille (score et infos de base uniquement dans ce cas)."
    folder: "src/content/resultats"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    summary: "{{adversaire}} — {{date}}"
    fields:
      - label: "Équipe"
        name: "equipeSlug"
        widget: "relation"
        collection: "equipes"
        search_fields: ["nom"]
        value_field: "slug"
        display_fields: ["nom"]
        hint: "Détectée automatiquement pour un résultat importé depuis une feuille de match ; à corriger ici seulement si la détection s'est trompée (compétition non reconnue)."

      - label: "Numéro d'équipe (si plusieurs équipes du club dans cette poule)"
        name: "equipeNumero"
        widget: "string"
        required: false
        hint: "Rempli automatiquement pour un résultat importé depuis une feuille de match. À renseigner ici uniquement pour un résultat saisi en secours, et seulement si plusieurs équipes du club sont engagées dans cette catégorie (ex. 1 ou 2 pour les Seniors masculins). Laissez vide sinon."

      - label: "Date et heure du match"
        name: "date"
        widget: "datetime"

      - label: "Journée"
        name: "journee"
        widget: "string"
        required: false
        hint: "Exemple : J1. Laissez vide pour un match de coupe ou amical."

      - label: "Compétition"
        name: "competition"
        widget: "string"
        required: false

      - label: "Type de match"
        name: "typeMatch"
        widget: "select"
        default: "championnat"
        options:
          - { label: "Championnat", value: "championnat" }
          - { label: "Coupe", value: "coupe" }
          - { label: "Autre", value: "autre" }

      - label: "Le HBI recevait"
        name: "domicile"
        widget: "boolean"
        default: true

      - label: "Adversaire"
        name: "adversaire"
        widget: "string"

      - label: "Salle"
        name: "salle"
        widget: "string"
        required: false

      - label: "Forfait"
        name: "forfait"
        widget: "select"
        required: false
        hint: "Uniquement si ce match n'a pas été disputé (forfait déclaré par une des deux équipes). Laissez vide pour un match normalement joué, et remplissez les scores ci-dessous comme d'habitude. Astuce : regardez /agenda pour retrouver la date et l'adversaire exacts de ce match avant de créer le résultat."
        options:
          - { label: "Le Handball Islois a déclaré forfait", value: "nous" }
          - { label: "L'adversaire a déclaré forfait", value: "adversaire" }

      - label: "Score du HBI"
        name: "scoreDomicile"
        widget: "number"
        value_type: "int"
        required: false
        hint: "Le score du HBI si « Le HBI recevait » est coché, sinon le score de l'adversaire. Laissez vide en cas de forfait (champ ci-dessus)."

      - label: "Score de l'adversaire"
        name: "scoreExterieur"
        widget: "number"
        value_type: "int"
        required: false
        hint: "Laissez vide en cas de forfait."

      - label: "Score du HBI à la mi-temps"
        name: "scoreMiTempsDomicile"
        widget: "number"
        value_type: "int"
        required: false

      - label: "Score de l'adversaire à la mi-temps"
        name: "scoreMiTempsExterieur"
        widget: "number"
        value_type: "int"
        required: false

      # Champs techniques : remplis automatiquement par l'import d'une
      # feuille de match, jamais à saisir à la main -- masqués du
      # formulaire (widget "hidden") pour ne pas être modifiés ou effacés
      # par erreur en éditant les champs ci-dessus.
      - label: "Origine (technique)"
        name: "source"
        widget: "hidden"
        default: "manuel"

      - label: "Code rencontre (technique)"
        name: "codeRencontre"
        widget: "hidden"
        required: false

      - label: "Chronologie (technique)"
        name: "chronologie"
        widget: "hidden"
        required: false

      - label: "Stats équipe domicile (technique)"
        name: "statsEquipeDomicile"
        widget: "hidden"
        required: false

      - label: "Stats équipe extérieur (technique)"
        name: "statsEquipeExterieur"
        widget: "hidden"
        required: false

      - label: "Stats joueur·se·s (technique)"
