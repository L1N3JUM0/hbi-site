name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 4h00 UTC = 5h00 (hiver) ou 6h00 (été) heure de Paris.
    # Rebuild quotidien pour garder l'agenda des matchs (flux iCal
    # FFHandball, récupérés au moment du build) à jour même sans commit.
    - cron: "0 4 * * *"
    # Soirs de match : récupère les feuilles du week-end dès leur
    # publication (voir scripts/recuperer-feuilles.mjs). Le cron de GitHub
    # est en UTC, sans heure d'été. Heures de Paris obtenues :
    #   samedi 21h UTC   = 22h (hiver) / 23h (été)
    #   dimanche 20h UTC = 21h (hiver) / 22h (été)
    # Les deux tombent le soir même dans les deux cas : le build du samedi
    # reste avant minuit (bloc "Ce week-end" de l'accueil, scores du samedi),
    # celui du dimanche après 18h ("Résultats du week-end", voir
    # src/lib/weekend.ts).
    - cron: "0 21 * * 6"
    - cron: "0 20 * * 0"

permissions:
  # "write" (au lieu de "read") : le build commite les résultats importés
  # depuis les feuilles de match (voir l'étape "Committer..." plus bas) --
  # nécessaire pour qu'ils soient visibles/corrigeables dans le CMS, qui
  # lit le dépôt réel sur GitHub, pas la sortie éphémère de ce build.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Toujours construire la POINTE de main, jamais le commit qui a
          # déclenché ce run. Quand plusieurs feuilles sont déposées coup sur
          # coup, GitHub met les exécutions en file (voir "concurrency"
          # ci-dessus) et une exécution ancienne peut se TERMINER après une
          # plus récente : elle écrasait alors le site déployé avec un état
          # périmé (incident du 27/09/2026 -- la feuille déposée en dernier
          # avait disparu du site après un tel dépassement). Avec `ref: main`,
          # une exécution en retard redéploie l'état complet du dépôt : le
          # résultat final ne dépend plus de l'ordre d'arrivée des builds.
          ref: main

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build Astro
        # LICENCE_HASH_PEPPER : pépin secret du hachage des numéros de
        # licence (voir src/lib/fdme/licenceHash.mjs) -- injecté ici comme
        # variable d'environnement (secret du dépôt), jamais commité. En
        # local, le même pépin vit dans .env.local (gitignoré).
        env:
          LICENCE_HASH_PEPPER: ${{ secrets.LICENCE_HASH_PEPPER }}
        run: npm run build

      - name: Vérifier qu'aucune feuille de match (PDF) ne sera commitée
        # Les feuilles portent noms et numéros de licence en clair : aucune
        # ne doit entrer dans le dépôt par ce workflow (décision du club).
        # Échec VOLONTAIRE du workflow (pas de "continue-on-error") : ni
        # commit, ni déploiement tant que ce n'est pas corrigé. Seuls les PDF
        # déposés à la main via le CMS, pas encore lus (illisibles, Loisirs
        # refusés), peuvent exister dans feuilles-match/files -- ils y sont
        # arrivés par le CMS, pas par ce workflow.
        run: |
          # Seulement les chemins présents ou suivis : un dossier vide
          # (feuilles-match une fois toutes les feuilles consommées) n'existe
          # pas dans un checkout, et `git add` échouerait sur lui (incident
          # du 28/09/2026 : commit des résultats en échec silencieux).
          for p in src/content/resultats src/content/feuilles-match src/content/statistiques-poules src/content/stats-brutes-ffhandball src/data/feuilles-auto.json; do
            if [ -e "$p" ] || [ -n "$(git ls-files -- "$p")" ]; then git add -A -- "$p"; fi
          done
          ajoutes=$(git diff --cached --name-only --diff-filter=AM | grep -i '\.pdf$' || true)
          if [ -n "$ajoutes" ]; then
            echo "::error::PDF sur le point d'être commité : $ajoutes"
            exit 1
          fi
          hors_cms=$(git ls-files | grep -i '\.pdf$' | grep -v '^src/content/feuilles-match/files/' || true)
          if [ -n "$hors_cms" ]; then
            echo "::error::PDF suivi par git hors du dossier des dépôts CMS : $hors_cms"
            exit 1
          fi
          if ! git check-ignore -q .feuilles-auto/controle.pdf; then
            echo "::error::Le dossier temporaire .feuilles-auto/ n'est plus ignoré par git (.gitignore)."
            exit 1
          fi

      - name: Committer les résultats et statistiques importés automatiquement
        # ATTENTION en modifiant ce fichier : le marqueur "[skip ci]" utilisé
        # dans le message du commit ci-dessous (git commit -m) est scanné par
        # GitHub sur le MESSAGE ENTIER de n'importe quel commit poussé sur
        # main, corps compris -- pas seulement sur les commits produits ici.
        # Un commit de travail qui citerait ce marqueur littéralement dans sa
        # description (même pour l'expliquer) se ferait lui-même ignorer par
        # ce workflow, sans échec ni message visible nulle part. Incident vu
        # en septembre 2026. Ne jamais écrire "[skip ci]" (ni variantes :
        # "[ci skip]", "[no ci]"...) ailleurs que dans la ligne `git commit`
        # ci-dessous.
        #
        # "npm run build" ci-dessus régénère :
        # - src/content/resultats/pdf-*.md depuis les PDF nouvellement
        #   déposés dans src/content/feuilles-match/, PUIS supprime ces PDF
        #   et leur entrée CMS (voir scripts/import-fdme.mjs : les feuilles
        #   portent les licences en clair, elles ne restent pas dans le
        #   dépôt) -- d'où le `git add` de feuilles-match ci-dessous, qui
        #   commite ces suppressions ;
        # - le retrait des lignes joueur·se des personnes absentes depuis
        #   plus de 3 saisons (voir scripts/retention-joueurs.mjs) ;
        # - src/data/feuilles-auto.json : suivi de la récupération
        #   automatique des feuilles (voir scripts/recuperer-feuilles.mjs),
        #   et les résultats de forfait qu'elle crée (resultats/ffh-*.md) ;
        # - src/content/statistiques-poules/*.md (extraction HBI) et
        #   src/content/stats-brutes-ffhandball/*.json (JSON brut complet,
        #   conservé pour un futur script de contrôle) depuis les pages
        #   ffhandball.fr renseignées dans les fiches équipes (voir
        #   scripts/import-stats-ffhandball.mjs).
        # Ces fichiers doivent être commités pour être visibles ET
        # corrigeables dans le CMS (Sveltia lit le dépôt réel sur GitHub,
        # jamais la sortie de ce build) -- une régénération identique (rien
        # de nouveau depuis le dernier build) ne produit aucune différence,
        # donc aucun commit ici. "[skip ci]" évite que ce commit ne
        # redéclenche immédiatement un nouveau build.
        # "continue-on-error" : un conflit de push (rare, deux builds
        # concurrents) ne doit pas empêcher le déploiement du site, qui a
        # déjà été construit à l'étape précédente -- le prochain build
        # (prochain commit, ou rebuild quotidien) réessaiera avec un
        # "checkout" à jour. Pas de "git pull --rebase" ici : le checkout
        # est peu profond (historique tronqué), le rebase y est fragile ;
        # un simple push qui échoue en cas de conflit, laissé à la
        # prochaine exécution, est plus sûr.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Même liste que l'étape de vérification ci-dessus (même précaution
          # sur les dossiers vides).
          for p in src/content/resultats src/content/feuilles-match src/content/statistiques-poules src/content/stats-brutes-ffhandball src/data/feuilles-auto.json; do
            if [ -e "$p" ] || [ -n "$(git ls-files -- "$p")" ]; then git add -A -- "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "Aucun résultat modifié."
          else
            git commit -m "Met à jour les résultats et statistiques importés automatiquement [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Uploader l'artefact du build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
