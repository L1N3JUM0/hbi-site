name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 4h00 UTC = 5h00 (hiver) ou 6h00 (été) heure de Paris.
    # Rebuild quotidien pour garder l'agenda des matchs (flux iCal
    # FFHandball, récupérés au moment du build) à jour même sans commit.
    - cron: "0 4 * * *"

permissions:
  # "write" (au lieu de "read") : le build commite les résultats importés
  # depuis les feuilles de match (voir l'étape "Committer..." plus bas) --
  # nécessaire pour qu'ils soient visibles/corrigeables dans le CMS, qui
  # lit le dépôt réel sur GitHub, pas la sortie éphémère de ce build.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Committer les résultats importés depuis les feuilles de match
        # ATTENTION en modifiant ce fichier : le marqueur "[skip ci]" utilisé
        # dans le message du commit ci-dessous (git commit -m) est scanné par
        # GitHub sur le MESSAGE ENTIER de n'importe quel commit poussé sur
        # main, corps compris -- pas seulement sur les commits produits ici.
        # Un commit de travail qui citerait ce marqueur littéralement dans sa
        # description (même pour l'expliquer) se ferait lui-même ignorer par
        # ce workflow, sans échec ni message visible nulle part. Incident vu
        # en septembre 2026. Ne jamais écrire "[skip ci]" (ni variantes :
        # "[ci skip]", "[no ci]"...) ailleurs que dans la ligne `git commit`
        # ci-dessous.
        #
        # "npm run build" ci-dessus régénère src/content/resultats/pdf-*.md
        # depuis les PDF de src/content/feuilles-match/ (voir
        # scripts/import-fdme.mjs). Ces fichiers doivent être commités pour
        # être visibles ET corrigeables dans le CMS (Sveltia lit le dépôt
        # réel sur GitHub, jamais la sortie de ce build) -- une régénération
        # identique (rien de nouveau depuis le dernier build) ne produit
        # aucune différence, donc aucun commit ici. "[skip ci]" évite que ce
        # commit ne redéclenche immédiatement un nouveau build.
        # "continue-on-error" : un conflit de push (rare, deux builds
        # concurrents) ne doit pas empêcher le déploiement du site, qui a
        # déjà été construit à l'étape précédente -- le prochain build
        # (prochain commit, ou rebuild quotidien) réessaiera avec un
        # "checkout" à jour. Pas de "git pull --rebase" ici : le checkout
        # est peu profond (historique tronqué), le rebase y est fragile ;
        # un simple push qui échoue en cas de conflit, laissé à la
        # prochaine exécution, est plus sûr.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/resultats
          if git diff --cached --quiet; then
            echo "Aucun résultat modifié."
          else
            git commit -m "Met à jour les résultats importés depuis les feuilles de match [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Uploader l'artefact du build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
